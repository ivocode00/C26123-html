<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,400;0,600;0,700;0,800;1,100;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style2.css" />
    <title>Ivan</title>
  </head>
  <body>
    <header>
      <div class="div-logo"><a class="logo" href="../index.html">LOGO</a></div>

      <nav class="header-nav">
        <ul>
          <li>
            <a href="../index.html">Inicio</a>
          </li>
          <li>
            <a href="./contacto.html">Contacto</a>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <h1 class="titulo-contacto text-secondary">Contactanos</h1>
      <form class="form-contacto" action="https://formspree.io" method="POST">
        <div class="grupo-input">
          <label for="email"> Your email: </label>
          <!-- El atributo 'name' es obligatorio para Formspree -->
          <input id="email" type="email" name="email" required />
        </div>

        <div class="grupo-input">
          <label for="mensaje"> Your message: </label>
          <!-- El atributo 'name' aquí también es clave -->
          <textarea id="mensaje" name="message" required></textarea>
        </div>

        <button class="btn bg-secondary text-dark" type="submit">Send</button>
      </form>
    </main>
    <footer>
      <p>Web creada por Ivan Arce</p>
      <nav>
        <ul class="footer-list">
          <li><img src="../img/whatsapp.png" alt="Whatsapp" /></li>
          <li><img src="../img/social.png" alt="Redes sociales" /></li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
